<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="LunaPilot - Land where the Sun never sets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1f52"/>
      <stop offset="0.55" stop-color="#070d24"/>
      <stop offset="1" stop-color="#02040d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#5a3cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="0.45" stop-color="#2f7fd6"/>
      <stop offset="1" stop-color="#0b2a6b"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa3b5"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="0.4" stop-color="#9fe8ff"/>
      <stop offset="0.7" stop-color="#d6ff3f"/>
      <stop offset="1" stop-color="#eaf2ff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#neb)"/>

    <!-- sun glow, breathing -->
    <circle cx="70" cy="40" r="210" fill="url(#sun)">
      <animate attributeName="r" values="190;230;190" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="95" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="40" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="55" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="150" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="35" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1210" cy="140" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="170" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="20" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="20" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shooting star -->
    <g>
      <line x1="0" y1="0" x2="110" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.55;0.6;0.7;1" dur="9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="1100,20;1100,20;1100,20;900,150;900,150" keyTimes="0;0.55;0.6;0.7;1" dur="9s" repeatCount="indefinite" additive="replace"/>
      </line>
    </g>

    <!-- lunar surface -->
    <path d="M0 300 C 220 268, 430 296, 650 282 S 1060 262, 1280 292 L1280 340 L0 340 Z" fill="url(#ground)"/>
    <path d="M0 300 C 220 268, 430 296, 650 282 S 1060 262, 1280 292" fill="none" stroke="#9fe8ff" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse cx="300" cy="312" rx="46" ry="8" fill="#000" opacity="0.35"/>
    <ellipse cx="860" cy="306" rx="60" ry="9" fill="#000" opacity="0.35"/>
    <ellipse cx="1090" cy="318" rx="38" ry="6" fill="#000" opacity="0.35"/>

    <!-- title -->
    <g filter="url(#glow)">
      <text x="64" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="700" fill="url(#title)" letter-spacing="1">LunaPilot
        <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
      </text>
    </g>
    <text x="68" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" fill="#d6ff3f">Land where the Sun never sets.
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.2s" fill="freeze"/>
    </text>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#eaf2ff">
      <rect x="68" y="228" rx="15" ry="15" width="530" height="32" fill="none" stroke="#78c8ff" stroke-opacity="0.6"/>
      <text x="86" y="249">NASA Space Apps Challenge 2026  |  Lunar Landing Site Navigator</text>
    </g>

    <!-- earth + orbiting moon -->
    <g transform="translate(1040,150)">
      <ellipse rx="150" ry="150" fill="none" stroke="#78c8ff" stroke-opacity="0.35" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="104" fill="none" stroke="#d6ff3f" stroke-opacity="0.3" stroke-dasharray="2 6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
        <circle cx="0" cy="-104" r="6" fill="#d6ff3f" filter="url(#glow)"/>
      </g>
      <circle r="62" fill="url(#earth)" filter="url(#glow)">
        <animate attributeName="r" values="62;64;62" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M-30 -18 q10 -16 26 -8 q8 10 -4 18 q-10 8 -22 -10z M10 6 q16 -8 26 6 q-4 16 -20 14 q-10 -8 -6 -20z" fill="#3fbf6e" opacity="0.75"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
        <circle cx="0" cy="-150" r="20" fill="url(#moon)" filter="url(#glow)"/>
        <circle cx="-5" cy="-155" r="3" fill="#7d8597" opacity="0.7"/>
        <circle cx="6" cy="-146" r="2.2" fill="#7d8597" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
